const api = async (p, body) => {

async function sincronizar() {

  try {
    const remoto = await rpc('cap_pull', {clave: cfg().clave}), remU = {};

    for (let k = 0; k < subir.length; k += 500) await rpc('cap_push', {clave: cfg().clave, datos: subir.slice(k, k + 500)});
    // examenes: union por id (un examen terminado no cambia)
    const exRem = await rpc('cap_pull_ex', {clave: cfg().clave}), ids = new Set(exRem.map(x => x[0]));
    for (const [id, ac, fa, bl, det] of exRem) if (!EXS.some(x => x.id === id)) { EXS.push({id, ac, fa, bl, det}); bajadas++; }
    EXS.sort((x, y) => x.id - y.id); guardarExamenes();
    const exSub = EXS.filter(x => !ids.has(x.id)).map(x => [x.id, x.ac, x.fa, x.bl, x.det]);
    for (let k = 0; k < exSub.length; k += 50) await rpc('cap_push_ex', {clave: cfg().clave, datos: exSub.slice(k, k + 50)});

  if ((m = s.match(/^(-?\d+(?:[.,]\d+)?)\s*%?(?:\s*\/\s*\d+)?$/))) return [1, parseFloat(m[1].replace(',', '.'))];

  const sel = k => { tabStats = k; [...tabs.children].forEach((b, j) => b.classList.toggle('on', j === k)); cuerpo.replaceChildren(pages[k]); };
  ['Por tema', 'Distribución', 'Mis exámenes'].forEach((t, k) => tabs.append(h('button', {onclick: () => sel(k)}, t)));
  show(h('div', {class: 'fila'}, btn('← Menú', menu), h('h2', {}, 'Estadísticas')), tabs, cuerpo);
  sel(tabStats);
}

// ---------- detalle de un tema
let filtroTema = 'todas';
function temaDetalle(t, filtro) {
  view = 'detalle'; S_det = t; if (filtro) filtroTema = filtro;
  const todas = Q.filter(q => temaDe(q) === t).sort((a, b) => (a.c - b.c) || String(a.c).localeCompare(String(b.c)));
  const grupos = {
    todas: ['Todas', todas], acertadas: ['Acertadas', todas.filter(q => st(q)[4] > 0)],
    falladas: ['Sin acertar', todas.filter(q => st(q)[0] > 0 && st(q)[4] === 0)], nuevas: ['Sin contestar', todas.filter(q => st(q)[0] === 0)]};
  const tabs = h('div', {class: 'tabs', style: 'flex-wrap:wrap'});
  for (const [k, [nom, l]] of Object.entries(grupos)) tabs.append(h('button', {class: k === filtroTema ? 'on' : '', onclick: () => temaDetalle(t, k)}, `${nom} (${l.length})`));
  const L = 'ABCD';
  const items = grupos[filtroTema][1].map(q => {
    const [txt, cl] = estadoQ(q), [i, f] = st(q);
    const det = h('div', {style: 'display:none'}, q.op.map((o, k) => h('div', {class: 'o ' + (L[k] === q.ok ? 'ok' : 'mut')}, (L[k] === q.ok ? '✔ ' : '   ') + `${L[k]}) ${o}`)));
    return h('div', {class: 'pq', onclick: () => { det.style.display = det.style.display === 'none' ? '' : 'none'; }},
      h('div', {class: 'e ' + cl}, `COD ${q.c} · ${txt}` + (i ? `  ·  ${i} ${i === 1 ? 'intento' : 'intentos'}, ${f} ${f === 1 ? 'fallo' : 'fallos'}` : '')), h('div', {class: 't'}, q.q), det);
  });
  show(h('div', {class: 'fila'}, btn('← Estadísticas', stats), h('h2', {}, `Tema ${t}`)),
    h('p', {class: 'resumen'}, `${todas.length} preguntas · ${grupos.acertadas[1].length} acertadas · ${grupos.falladas[1].length} sin acertar · ${grupos.nuevas[1].length} sin contestar`),
    tabs, h('p', {class: 'ayuda'}, 'Toca una pregunta para ver sus respuestas.'), items.length ? items : h('p', {class: 'muted'}, 'No hay preguntas en este grupo.'));
}
let S_det = null;

// ---------- examen (se guarda en este dispositivo por si se recarga la pagina)
let E = null;
const EXKEY = 'cap_examen';
function cargarExamen() { try { return JSON.parse(ls.get(EXKEY)); } catch (e) { return null; } }
const guardarExamen = () => ls.set(EXKEY, JSON.stringify(E));
async function examenNuevo() {
  if (cargarExamen() && !confirm('Ya tienes un examen en curso. ¿Empezar uno nuevo y descartarlo?')) return;
  const r = await api('/api/examen/nuevo');
  E = {preguntas: r.preguntas, resp: {}, i: 0, fin: Date.now() + r.minutos * 60000};
  guardarExamen(); examenPintar();
}
function resto() { return Math.max(Math.floor((E.fin - Date.now()) / 1000), 0); }
function examenPintar() {
  if (!E) E = cargarExamen();
  if (!E) return menu();
  view = 'examen';
  const i = E.i, q = E.preguntas[i], n = E.preguntas.length, sel = E.resp[q.id];
  const reloj = h('span', {class: 'reloj'});
  const upd = () => {
    const s = resto();
    reloj.textContent = `⏱ ${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
    reloj.classList.toggle('rojo', s < 300);
    if (s <= 0) examenTerminar(true);
  };
  const opts = q.opciones.map((t, k) => h('button', {class: 'opt' + ('ABCD'[k] === sel ? ' sel' : ''), onclick: () => examenResponder('ABCD'[k])}, h('b', {}, 'ABCD'[k]), t));
  show(h('div', {class: 'fila'}, btn('✕ Abandonar', examenAbandonar), reloj),
    h('div', {class: 'muted'}, `Pregunta ${i + 1} de ${n} · Sección ${q.seccion} · Contestadas ${Object.keys(E.resp).length}`),
    h('div', {class: 'ayuda'}, `Acierto +1 · Fallo −0,5 · En blanco 0 · Aprobado con ${NOTA_APROBADO}`),
    h('div', {class: 'card'}, q.pregunta), opts,
    sel ? btn('Dejar sin contestar (0)  ·  tecla 0', examenBorrar, 'sm') : null,
    h('div', {class: 'fila'},
      h('div', {}, i > 0 ? btn('← Anterior', () => examenIr(-1)) : null),
      h('div', {}, i < n - 1 ? btn('Siguiente →', () => examenIr(1)) : null),
      btn('Terminar examen', () => examenTerminar(false), 'acc')));
  upd(); timer = setInterval(upd, 1000);
}
function examenResponder(l) {
  if (view !== 'examen') return;
  const id = E.preguntas[E.i].id;
  if (E.resp[id] === l) return examenBorrar();       // tocar la ya marcada la desmarca (en blanco)
  E.resp[id] = l;
  if (E.i < E.preguntas.length - 1) E.i++;
  guardarExamen(); examenPintar();
}
function examenBorrar() { if (view !== 'examen') return; delete E.resp[E.preguntas[E.i].id]; guardarExamen(); examenPintar(); }
function examenIr(d) { E.i = Math.min(Math.max(E.i + d, 0), E.preguntas.length - 1); guardarExamen(); examenPintar(); }
function examenAbandonar() { if (confirm('¿Abandonar el examen? Se perderán las respuestas.')) { ls.del(EXKEY); E = null; menu(); } }
let R = null;
async function examenTerminar(forzado) {
  if (view !== 'examen') return;
  const blancos = E.preguntas.length - Object.keys(E.resp).length;
  if (!forzado && !confirm(blancos ? `Te quedan ${blancos} preguntas sin contestar (puntúan 0).\n\n¿Terminar el examen?` : '¿Terminar el examen?')) return;
  view = 'enviando'; clearInterval(timer);
  R = await api('/api/examen/terminar', {ids: E.preguntas.map(p => p.id), respuestas: E.resp, perms: Object.fromEntries(E.preguntas.map(p => [p.id, p.perm]))});
  ls.del(EXKEY); E = null; sincronizar(); resultado();      // sube el examen a la nube
}
function examenAbrir(id) {
  const ex = EXS.find(x => x.id === id); if (!ex) return;
  R = resumenExamen(ex); R.hist = true; resultado();
}
function resultado() {
  view = 'resultado';
  show(h('h2', {}, R.hist ? 'Examen del ' + fecha(R.id) : 'Resultado del examen'),
    h('div', {class: 'nota ' + (R.aprobado ? 'ok' : 'ko')}, `Nota: ${fmt(R.nota)} / 100 — ${R.aprobado ? 'APROBADO' : 'SUSPENSO'}`),
    h('p', {class: 'muted'}, `${R.aciertos} aciertos (+${R.aciertos}) · ${R.fallos} fallos (−${fmt(R.fallos * 0.5)}) · ${R.blancos} en blanco (0) · Para aprobar: ${NOTA_APROBADO}`),
    tabla(['Tema', 'Preguntas', 'Aciertos', 'Fallos', 'En blanco', 'Puntos'], R.temas), h('div', {style: 'height:14px'}),
    R.errores.length ? btn(`Ver falladas y sin contestar (${R.errores.length})`, revision, 'acc') : null,
    R.hist ? btn('← Mis exámenes', () => { tabStats = 2; stats(); }) : btn('Nuevo examen', examenNuevo), btn('Menú', menu));
}
function revision() {
  view = 'revision';
  const L = 'ABCD';
  show(h('div', {class: 'fila'}, btn('← Resultado', resultado), h('h2', {}, 'Falladas y sin contestar')),
    R.errores.map(e => h('div', {class: 'err'},
      h('div', {class: e.tuya ? 'ko' : 'mut'}, e.tuya ? '✘ FALLADA (−0,5)' : '— SIN CONTESTAR (0)'),
      h('div', {class: 'q'}, `${e.n}. [${e.tema}] ${e.pregunta}`),
      e.opciones.map((t, k) => h('div', {class: 'o ' + (L[k] === e.correcta ? 'ok' : L[k] === e.tuya ? 'ko' : 'mut')},
        (L[k] === e.correcta ? '✔ ' : L[k] === e.tuya ? '✘ ' : '   ') + `${L[k]}) ${t}` + (L[k] === e.tuya ? '   ← tu respuesta' : ''))))));
}

// ---------- teclado (en el PC tambien funciona)
const idxTecla = k => k.length === 1 ? Math.max('1234'.indexOf(k), 'abcd'.indexOf(k.toLowerCase())) : -1;
document.addEventListener('keydown', ev => {
  const k = ev.key;
  if (view === 'pregunta') {
    if (idxTecla(k) >= 0) responder(idxTecla(k));
    else if (['Enter', ' ', 'ArrowRight'].includes(k) && S.resuelta) siguiente();
    else if (k === 'Escape') menu();
  } else if (view === 'examen') {
    if (idxTecla(k) >= 0) examenResponder('ABCD'[idxTecla(k)]);
    else if (k === 'ArrowRight' || k === 'Enter') examenIr(1);
    else if (k === 'ArrowLeft') examenIr(-1);
    else if (k === '0' || k === 'Backspace' || k === 'Delete') examenBorrar();
    else if (k === 'Escape') examenAbandonar();
  } else if (view === 'menu') {
    if (k === '1') sesion('normal'); else if (k === '2') sesion('falladas');
    else if (k === '3') stats(); else if (k === '4') examenNuevo(); else if (k === '5') temasElegir();
  } else if (k === 'Escape' && view !== 'enviando') {
    if (view === 'revision') resultado();
    else if (view === 'detalle' || (view === 'resultado' && R && R.hist)) stats();
    else menu();
  }
});
async function iniciar() {
  cargarLocal();
  try {
    const arr = await (await fetch('preguntas.json')).json();
    Q = arr.map(a => ({id: a[0], s: a[1], o: a[2], c: a[3], q: a[4], op: [a[5], a[6], a[7], a[8]], ok: a[9]}));
    QID = new Map(Q.map(q => [q.id, q]));
  } catch (e) { return show(h('p', {class: 'aviso'}, 'No se pudieron cargar las preguntas. Abre la app con internet al menos una vez.'), btn('Reintentar', iniciar, 'acc')); }
  menu(); sincronizar();
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') sincronizar(); });
window.addEventListener('online', sincronizar);
setInterval(() => { if (document.visibilityState === 'visible' && view !== 'examen' && Date.now() - ultimoSync > 45000) sincronizar(); }, 15000);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
iniciar();
</script>
